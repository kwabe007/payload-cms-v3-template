# This docker-compose file is used for development purposes.

services:
  cms:
    build:
      context: .
    environment:
      # The dockerized Payload runs in production, so its migrations won't work with the dev database. This overrides
      # the database URL given by the `.env` file.
      - DATABASE_URL=postgres://postgres:password@127.0.0.1:5432/payload_cms_v3_template_docker
    env_file:
      - .env
    network_mode: host
    volumes:
      - uploads:/app/uploads

volumes:
  uploads:
