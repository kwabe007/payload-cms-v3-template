name: Build and deploy to staging

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: registry.gitlab.com
  GITLAB_USERNAME: ${{ secrets.GITLAB_USERNAME }}
  GITLAB_PASSWORD: ${{ secrets.GITLAB_PASSWORD }}
  # Example: https://dokploy.mydomain.com/api/application.deploy
  DOKPLOY_DEPLOY_ENDPOINT: ${{ vars.DOKPLOY_DEPLOY_ENDPOINT }}
  DOKPLOY_ACCESS_TOKEN: ${{ secrets.DOKPLOY_ACCESS_TOKEN }}
  DOKPLOY_STAGING_APP_ID: ${{ vars.DOKPLOY_STAGING_APP_ID }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME }}
  GITHUB_SHA: ${{ github.sha }}
  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Login to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.GITLAB_USERNAME }}
          password: ${{ env.GITLAB_PASSWORD }}

      - name: Build image
        run: |
          docker build \
            --secret id=sentry_auth_token,env=SENTRY_AUTH_TOKEN \
            --build-arg SENTRY_URL=${{ vars.SENTRY_URL }} \
            --build-arg SENTRY_ORG=${{ vars.SENTRY_ORG }} \
            --build-arg SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }} \
            --build-arg NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }} \
            -t $IMAGE_NAME:staging .

      - name: Push image
        run: |
          docker push $IMAGE_NAME:staging

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to staging instance
        run: |
          tmpfile=$(mktemp)

          status=$(curl -s -o "$tmpfile" -w "%{http_code}" -X POST \
          "$DOKPLOY_DEPLOY_ENDPOINT" \
          -H "x-api-key: $DOKPLOY_ACCESS_TOKEN" \
          -H "Content-Type: application/json" \
          -d "{ \"applicationId\": \"$DOKPLOY_STAGING_APP_ID\"}")

          body=$(cat "$tmpfile")
          rm "$tmpfile"

          if [[ ! $status =~ ^2 ]]; then
            echo "Deployment failed (status $status)" >&2
            echo "Response from server:" >&2
            echo "$body" >&2
            exit 1
          fi

          echo "Deployment queued successfully"
