name: Build and deploy to staging

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: registry.gitlab.com
  GITLAB_USERNAME: ${{ secrets.GITLAB_USERNAME }}
  GITLAB_PASSWORD: ${{ secrets.GITLAB_PASSWORD }}
  DOKPLOY_DEPLOY_ENDPOINT: ${{ vars.DOKPLOY_DEPLOY_ENDPOINT }}
  DOKPLOY_ACCESS_TOKEN: ${{ secrets.DOKPLOY_ACCESS_TOKEN }}
  DOKPLOY_STAGING_APP_ID: ${{ vars.DOKPLOY_STAGING_APP_ID }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME }}
  GITHUB_SHA: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Login to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.GITLAB_USERNAME }}
          password: ${{ env.GITLAB_PASSWORD }}

      - name: Build image
        # Pass any non-empty string to build arg S3_BUCKET so that the correct import map is generated. The name of the
        # actual bucket will be passed as a runtime environment variable.
        run: |
          docker build --build-arg S3_BUCKET=s3-bucket -t $IMAGE_NAME:staging .

      - name: Push image
        run: |
          docker push $IMAGE_NAME:staging

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to staging instance
        run: |
          tmpfile=$(mktemp)

          status=$(curl -s -o "$tmpfile" -w "%{http_code}" -X POST \
          "$DOKPLOY_DEPLOY_ENDPOINT" \
          -H "x-api-key: $DOKPLOY_ACCESS_TOKEN" \
          -H "Content-Type: application/json" \
          -d "{ \"applicationId\": \"$DOKPLOY_STAGING_APP_ID\"}")

          body=$(cat "$tmpfile")
          rm "$tmpfile"

          if [[ ! $status =~ ^2 ]]; then
            echo "Deployment failed (status $status)" >&2
            echo "Response from server:" >&2
            echo "$body" >&2
            exit 1
          fi

          echo "Deployment queued successfully"
